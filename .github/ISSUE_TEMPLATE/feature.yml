name: Feature
description: New behaviour or a change to existing behaviour.
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: >-
        Add an `area:*`, `priority:*` and `size:*` label and a milestone
        after the issue is created.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and what it touches.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: One checkbox per piece of work.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checks that prove the issue is done.
      value: |
        - 
    validations:
      required: true
  - type: textarea
    id: depends-on
    attributes:
      label: Depends on
      description: One `- #<n>` line per blocking issue. Leave empty if none.
      placeholder: "- #7"
    validations:
      required: false
